<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" role="img" aria-labelledby="title desc">
  <title id="title">Vide Verum brand mark</title>
  <desc id="desc">Two offset circles intersect around a focused central lens.</desc>
  <defs>
    <clipPath id="clip-orange" clipPathUnits="userSpaceOnUse">
      <circle cx="140" cy="105" r="60"/>
    </clipPath>
    <g id="lens-shape">
      <circle cx="80" cy="65" r="60" clip-path="url(#clip-orange)"/>
    </g>
  </defs>
  <circle cx="80" cy="65" r="60" fill="#18C3BB"/>
  <circle cx="140" cy="105" r="60" fill="#FF5A2F"/>
  <use href="#lens-shape" fill="#F6F1E7"/>
  <g transform="translate(110 85) scale(.72) translate(-110 -85)">
    <use href="#lens-shape" fill="#11131A"/>
  </g>
</svg>
