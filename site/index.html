<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VideVerum</title>
    <meta name="description" content="VideVerum is the parent company behind a small family of independent software products." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1a1a1a;
        background: #fafafa;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: 1.5rem; letter-spacing: 0.02em; font-weight: 600; }
      p { margin-top: 0.75rem; color: #555; }
      @media (prefers-color-scheme: dark) {
        body { color: #ededed; background: #111; }
        p { color: #aaa; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VideVerum</h1>
      <p>Parent company to a small family of independent software products. A proper site is on its way.</p>
    </main>
  </body>
</html>
