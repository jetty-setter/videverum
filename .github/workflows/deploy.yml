name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-videverum-prod
  cancel-in-progress: false

permissions:
  id-token: write # request the GitHub OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # This site is hand-written and currently has no content-hashed build assets.
      # Do not mark CSS/SVG files immutable: their URLs are stable and are edited
      # in place, so a year-long browser cache can keep an obsolete design visible.
      - name: Sync static assets
        run: |
          aws s3 sync site/ "s3://${{ vars.SITE_BUCKET }}/" \
            --no-progress --delete \
            --exclude "index.html" --exclude "robots.txt" \
            --cache-control "no-cache"

      - name: Upload entry documents without caching
        run: |
          aws s3 cp site/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --no-progress \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp site/robots.txt "s3://${{ vars.SITE_BUCKET }}/robots.txt" \
            --no-progress \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" \
            --content-type "text/plain; charset=utf-8"

      - name: Invalidate CloudFront and wait
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$INVALIDATION_ID"

      - name: Purge Cloudflare cache when configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Cloudflare purge not configured. Add CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ZONE_ID variable to enable it."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}'
